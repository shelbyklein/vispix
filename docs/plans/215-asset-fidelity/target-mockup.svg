<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, sans-serif">
  <!-- Wireframe of #215 target states. Not pixel-final. -->
  <rect width="1200" height="700" fill="#0b0f17"/>
  <text x="32" y="44" fill="#e8ecf2" font-size="22" font-weight="600">#215 target: exact logos, no silent fallbacks, honest labels</text>
  <text x="32" y="70" fill="#8a94a6" font-size="14">Logos marked exact are stamped from the original file. Missing inputs stop and ask. Reinterpreted photos are labelled.</text>

  <!-- 1. Missing input (Create plan / campaign) -->
  <g transform="translate(32,100)">
    <text x="0" y="0" fill="#8a94a6" font-size="13" font-weight="600">1 · MISSING REQUIRED INPUT (Create plan and campaign concept)</text>
    <rect x="0" y="14" width="540" height="190" rx="12" fill="#121826" stroke="#b45309"/>
    <text x="20" y="44" fill="#fcd34d" font-size="15" font-weight="600">⚠ Primary logo not found</text>
    <text x="20" y="68" fill="#e8ecf2" font-size="13">This design asks for your primary logo, but none is marked in Assets.</text>
    <rect x="20" y="86" width="150" height="34" rx="8" fill="#1f2937"/><text x="34" y="108" fill="#e8ecf2" font-size="13">Choose a logo…</text>
    <rect x="182" y="86" width="230" height="34" rx="8" fill="#1f2937"/><text x="196" y="108" fill="#e8ecf2" font-size="13">Continue without a logo</text>
    <text x="20" y="150" fill="#8a94a6" font-size="12">Generate stays disabled until you choose. "Continue without" is recorded and the</text>
    <text x="20" y="168" fill="#8a94a6" font-size="12">output is labelled "No logo used".</text>
  </g>

  <!-- 2. Output with exact logo -->
  <g transform="translate(608,100)">
    <text x="0" y="0" fill="#8a94a6" font-size="13" font-weight="600">2 · RESULT WITH AN EXACT LOGO</text>
    <rect x="0" y="14" width="220" height="220" rx="10" fill="#1e3a8a"/>
    <text x="18" y="60" fill="#ffffff" font-size="22" font-weight="700">SPRING OPEN</text>
    <rect x="130" y="168" width="78" height="54" rx="4" fill="#ffffff"/>
    <text x="140" y="200" fill="#1e3a8a" font-size="13" font-weight="700">LOGO ✓</text>
    <rect x="236" y="14" width="324" height="140" rx="10" fill="#121826" stroke="#2a3346"/>
    <text x="250" y="40" fill="#86efac" font-size="13" font-weight="600">✓ Logo placed exactly</text>
    <text x="250" y="60" fill="#8a94a6" font-size="11">From the original file "USA Archery primary"</text>
    <text x="250" y="78" fill="#8a94a6" font-size="11">Position chosen by the model; logo pixels</text>
    <text x="250" y="94" fill="#8a94a6" font-size="11">stamped by Vispix, not redrawn.</text>
    <text x="250" y="124" fill="#fcd34d" font-size="12">⚠ Photo reinterpreted by AI</text>
    <text x="250" y="142" fill="#8a94a6" font-size="11">Original photo linked; not pixel-exact.</text>
  </g>

  <!-- 3. Provenance in Generations detail -->
  <g transform="translate(32,350)">
    <text x="0" y="0" fill="#8a94a6" font-size="13" font-weight="600">3 · PROVENANCE (Generations detail)</text>
    <rect x="0" y="14" width="876" height="150" rx="12" fill="#121826" stroke="#2a3346"/>
    <text x="20" y="44" fill="#e8ecf2" font-size="14" font-weight="600">How this was made</text>
    <text x="20" y="68" fill="#e8ecf2" font-size="12">Model: gpt-image (settings: 1:1, 1024×1024, quality high) · Generated 2026-10-04 14:02</text>
    <text x="20" y="90" fill="#e8ecf2" font-size="12">Inputs: hero photo archer_07.jpg (reinterpreted) · exact logo "USA Archery primary" (file revision a1b2c3)</text>
    <text x="20" y="112" fill="#e8ecf2" font-size="12">Logo layout: x 812, y 860, 180×126 px · placement: model placeholder detected</text>
    <text x="20" y="134" fill="#e8ecf2" font-size="12">Revised from generation #41 · Rights considered: recorded (USA Archery)</text>
  </g>

  <!-- 4. Unsupported canvas -->
  <g transform="translate(32,560)">
    <text x="0" y="0" fill="#8a94a6" font-size="13" font-weight="600">4 · UNSUPPORTED CANVAS</text>
    <rect x="0" y="14" width="876" height="56" rx="10" fill="#121826" stroke="#2a3346"/>
    <text x="20" y="48" fill="#e8ecf2" font-size="13">Concept asked for 4:5 — not supported. Rendered as Portrait 2:3 and labelled "requested 4:5, made 2:3".</text>
  </g>
</svg>
